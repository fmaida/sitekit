it:
    Trattoria Alla Scala è un ristorante veneziano situato in 
    Corte Lucatello 571, San Marco, Venezia. Offre un'esperienza 
    culinaria autentica con un menu di pasta tradizionale e piatti 
    di carne e pesce.
en: 
    Trattoria Alla Scala is an Italian restaurant located in Corte 
    Lucatello 571, San Marco, Venice. It offers an authentic culinary 
    experience with a menu of traditional pasta and meat and fish dishes.
fr: 
    La Trattoria Alla Scala est un restaurant vénitien situé au 571 Corte 
    Lucatello, rue San Marco, à Venise. Il propose une expérience culinaire 
    authentique avec un menu composé de pâtes traditionnelles, de viandes et 
    de poissons.
de:
    Trattoria Alla Scala ist ein venezianisches Restaurant in der Corte 
    Lucatello 571, San Marco, Venedig. Es bietet ein authentisches kulinarisches 
    Erlebnis mit einem Menü aus traditionellen Pasta- und Fleisch- und Fischgerichten.
es:
    La Trattoria Alla Scala es un restaurante veneciano situado en Corte 
    Lucatello 571, San Marco, Venecia. Ofrece una experiencia culinaria auténtica 
    con un menú de pasta tradicional y platos de carne y pescado.
pt:
    A Trattoria Alla Scala é um restaurante veneziano localizado na Corte 
    Lucatello 571, San Marco, Veneza. Oferece uma experiência culinária autêntica 
    com um menu de massas tradicionais e pratos de carne e peixe.  
nl:
    Trattoria Alla Scala is een Venetiaans restaurant gelegen in Corte 
    Lucatello 571, San Marco, Venetië. Het biedt een authentieke 
    culinaire ervaring met een menu van traditionele pasta en vlees- en
    visgerechten.
