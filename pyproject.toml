[project]
name = "sitekit"
version = "1.0.8b1"
description = ""
authors = [
    {name = "Francesco Maida",email = "francesco.maida@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "python-frontmatter>=1.1.0,<2.0.0",
    "pillow>=11.3.0,<12.0.0",
    "babel>=2.17.0,<3.0.0",
    "flask-minify>=0.50,<0.51",
    "markdown>=3.8.2,<4.0.0",
    "openai (>=1.101.0,<2.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "feedparser (>=6.0.12,<7.0.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
colorama = "^0.4.6"

[tool.poetry]
packages = [{include = "sitekit", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
